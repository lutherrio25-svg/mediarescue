[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mediarescue"
version = "0.8.0"
description = "Diagnose and repair damaged MP4, AVI and MP3 files: decode-verified output, batch mode, originals never modified"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lutherrio25-svg" }]
keywords = ["video-repair", "audio-repair", "mp4", "avi", "mp3", "moov", "fragmented",
            "data-recovery", "ffmpeg", "av1", "h264", "salvage", "carve", "corrupt-files"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Recovery Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lutherrio25-svg/mediarescue"
Source = "https://github.com/lutherrio25-svg/mediarescue"
Issues = "https://github.com/lutherrio25-svg/mediarescue/issues"
Changelog = "https://github.com/lutherrio25-svg/mediarescue/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.5"]

[project.scripts]
mediarescue = "mediarescue.cli:main"

[tool.ruff]
# Pinned so a ruff upgrade cannot turn main red without a commit that says so.
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "SIM", "RUF", "PLW", "ISC", "FURB", "C4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
