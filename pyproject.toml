[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediarescue"
version = "0.1.0"
description = "Forensic-safe diagnosis and repair toolkit for damaged MP4/MP3/JPEG/PNG media"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lutherrio25-svg" }]
keywords = ["video-repair", "mp4", "moov", "fragmented", "data-recovery", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Recovery Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mediarescue = "mediarescue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
