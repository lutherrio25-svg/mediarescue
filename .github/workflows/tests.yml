name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Runner images vary: apt sources sometimes lack universe, so fall back to a
          # static build rather than let every ffmpeg test skip and the job go green.
          sudo add-apt-repository -y universe || true
          sudo apt-get update || true
          if ! sudo apt-get install -y ffmpeg; then
            echo "apt has no ffmpeg; downloading a static build"
            curl -fsSL -o /tmp/ffmpeg.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ffmpeg-static
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
            sudo install -m 0755 /tmp/ffmpeg-static/ffmpeg /tmp/ffmpeg-static/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: python -m pip install -e .[dev]
      - name: Require a real ffmpeg
        run: |
          python -c "from mediarescue.ffmpeg import have_ffmpeg; raise SystemExit(0 if have_ffmpeg() else 'ffmpeg missing: tests would skip silently')"
      - run: python -m pytest -q -rs

  # The unit tests call functions; this installs the built wheel and drives the shipped CLI,
  # which is where packaging mistakes (missing console script, stale module list) show up.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo add-apt-repository -y universe || true
          sudo apt-get update || true
          if ! sudo apt-get install -y ffmpeg; then
            curl -fsSL -o /tmp/ffmpeg.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ffmpeg-static
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
            sudo install -m 0755 /tmp/ffmpeg-static/ffmpeg /tmp/ffmpeg-static/ffprobe /usr/local/bin/
          fi
          ffmpeg -version | head -1
      - name: Build and install the wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel
          python -m pip install --quiet dist/*.whl
      - name: Acceptance run against the installed CLI
        run: python scripts/acceptance_check.py
