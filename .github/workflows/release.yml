name: release

# A tag builds the package and publishes it as a GitHub release, so a release never depends on
# whichever personal token happens to be in someone's keyring having the "releases" permission.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: take the release notes from CHANGELOG.md
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## {re.escape(version)}\s*$(.*?)(?=^## |\Z)",
                            text, re.MULTILINE | re.DOTALL)
          body = (match.group(1).strip() if match else "") or f"Release {version}"
          pathlib.Path("notes.md").write_text(body + "\n", encoding="utf-8")
          print(body[:400])
          PY

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-pushed tag (fixing a just-released build) must replace the release instead of
          # failing with "a release with the same tag name already exists".
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
