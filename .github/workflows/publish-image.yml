name: publish image

# Fills the repository's Packages section with a container that already has ffmpeg inside,
# so a damaged file can be repaired without installing Python anywhere.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "extra image tag, e.g. 0.2.0 (empty = latest only)"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
